<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能问数 - 登录</title>
    <link rel="stylesheet" href="{{ static_url('bootstrap-5.3.8-dist/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('fontawesome-free-5.15.4-web/css/all.min.css') }}">
    <style>
        :root {
            --bg: #0a0e17;
            --card: rgba(18, 24, 40, 0.95);
            --accent: #00d4ff;
            --purple: #a855f7;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body {
            min-height:100vh;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0,212,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(34,211,238,0.05) 0%, transparent 50%);
            display:flex;align-items:center;justify-content:center;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            padding:20px;
        }
        .login-card {
            width:100%;max-width:420px;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius:24px;
            padding:50px 40px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .login-card .logo {
            text-align:center;margin-bottom:40px;
        }
        .login-card .logo h1 {
            font-size:28px;font-weight:800;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            margin-bottom:8px;
        }
        .login-card .logo p {
            color:rgba(255,255,255,0.4);font-size:13px;
        }
        .form-group{margin-bottom:20px;}
        .form-group label {
            display:block;color:rgba(255,255,255,0.6);font-size:13px;
            margin-bottom:8px;font-weight:500;
        }
        .form-input {
            width:100%;padding:14px 16px;
            background:rgba(255,255,255,0.04);
            border:1px solid rgba(255,255,255,0.1);
            border-radius:12px;color:#fff;font-size:15px;
            transition:all .3s;outline:none;
        }
        .form-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(0,212,255,0.15);
        }
        .form-input::placeholder{color:rgba(255,255,255,0.2);}
        .btn-login {
            width:100%;padding:14px;
            background: linear-gradient(135deg, var(--accent), var(--purple));
            border:none;border-radius:12px;color:#fff;
            font-size:16px;font-weight:600;cursor:pointer;
            transition:all .3s;margin-top:10px;
        }
        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.3);
        }
        .error-msg {
            background:rgba(239,68,68,0.15);
            border:1px solid rgba(239,68,68,0.3);
            color:#ef4444;padding:12px;border-radius:10px;
            font-size:13px;margin-bottom:20px;text-align:center;
        }
        .links {
            text-align:center;margin-top:24px;
        }
        .links a {
            color:rgba(255,255,255,0.4);text-decoration:none;font-size:13px;
            transition:color .3s;
        }
        .links a:hover{color:var(--accent);}
        .links span{color:rgba(255,255,255,0.2);margin:0 8px;}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <h1><i class="fas fa-robot me-2"></i>智能问数</h1>
            <p>AI驱动 · 数据对话 · 智能洞察</p>
        </div>
        {% if error %}
        <div class="error-msg"><i class="fas fa-exclamation-circle me-1"></i>{{ error }}</div>
        {% end %}
        <form method="post">
            {% raw xsrf_form_html() %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" class="form-input" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" class="form-input" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt me-2"></i>登录
            </button>
        </form>
        <div class="links">
            <a href="/">← 返回首页</a>
            <span>|</span>
            <a href="/user/register">注册账号</a>
            <span>|</span>
            <a href="/admin/login">后台管理</a>
        </div>
    </div>
</body>
</html>
