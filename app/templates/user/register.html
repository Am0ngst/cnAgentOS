<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智能问数 - 注册</title>
    <link rel="stylesheet" href="{{ static_url('bootstrap-5.3.8-dist/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('fontawesome-free-5.15.4-web/css/all.min.css') }}">
    <style>
        :root { --bg: #0a0e17; --card: rgba(18,24,40,0.95); --accent: #00d4ff; --purple: #a855f7; }
        *{margin:0;padding:0;box-sizing:border-box;}
        body {
            min-height:100vh;background:var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(0,212,255,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(168,85,247,0.06) 0%, transparent 50%);
            display:flex;align-items:center;justify-content:center;
            font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            padding:20px;
        }
        .card {
            width:100%;max-width:420px;background:var(--card);
            border:1px solid rgba(255,255,255,0.08);border-radius:24px;
            padding:50px 40px;backdrop-filter:blur(20px);
            box-shadow:0 20px 60px rgba(0,0,0,0.5);
        }
        .card .logo{text-align:center;margin-bottom:40px;}
        .card .logo h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
        .card .logo p{color:rgba(255,255,255,0.4);font-size:13px;}
        .fg{margin-bottom:18px;}
        .fg label{display:block;color:rgba(255,255,255,0.6);font-size:13px;margin-bottom:6px;font-weight:500;}
        .fi{width:100%;padding:14px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:12px;color:#fff;font-size:15px;transition:all .3s;outline:none;}
        .fi:focus{border-color:var(--accent);box-shadow:0 0 20px rgba(0,212,255,0.15);}
        .fi::placeholder{color:rgba(255,255,255,0.2);}
        .btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--purple));border:none;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:all .3s;margin-top:10px;}
        .btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,212,255,0.3);}
        .err{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;padding:12px;border-radius:10px;font-size:13px;margin-bottom:20px;text-align:center;}
        .links{text-align:center;margin-top:24px;}
        .links a{color:rgba(255,255,255,0.4);text-decoration:none;font-size:13px;transition:color .3s;}
        .links a:hover{color:var(--accent);}
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <h1><i class="fas fa-user-plus me-2"></i>注册账号</h1>
            <p>加入智能问数，开启AI对话之旅</p>
        </div>
        {% if error %}
        <div class="err"><i class="fas fa-exclamation-circle me-1"></i>{{ error }}</div>
        {% end %}
        <form method="post">
            {% raw xsrf_form_html() %}
            <div class="fg">
                <label>用户名</label>
                <input type="text" class="fi" name="username" placeholder="2-20个字符" required autofocus>
            </div>
            <div class="fg">
                <label>密码</label>
                <input type="password" class="fi" name="password" placeholder="至少6位" required>
            </div>
            <div class="fg">
                <label>确认密码</label>
                <input type="password" class="fi" name="password2" placeholder="再次输入密码" required>
            </div>
            <button type="submit" class="btn">
                <i class="fas fa-check-circle me-2"></i>注册
            </button>
        </form>
        <div class="links">
            <a href="/">← 返回首页</a>
            <span style="color:rgba(255,255,255,0.2);margin:0 8px;">|</span>
            <a href="/user/login">已有账号？立即登录</a>
        </div>
    </div>
</body>
</html>
